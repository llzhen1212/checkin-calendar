<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打卡日曆</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,"Noto Sans TC",sans-serif;overflow:hidden;color:#222}button,input,select{font:inherit}.pages{width:100vw;height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}.pages::-webkit-scrollbar{display:none}.page{min-width:100vw;height:100dvh;overflow-y:auto;scroll-snap-align:start;padding:28px 20px}.daily-page{background:#fffdf7}.year{font-size:16px;color:#777;margin-bottom:4px}.date{font-size:42px;font-weight:700;margin-bottom:18px}.person-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;margin-bottom:18px;border-radius:15px;background:#eeeae2}.person-button{border:0;border-radius:11px;padding:10px;color:#777;background:transparent}.person-button.active{color:#222;font-weight:700;background:#fff;box-shadow:0 2px 8px #0002}.person-button.sister.active{opacity:.65}.task-box{background:#fff;border-radius:20px;padding:8px 20px;box-shadow:0 4px 18px #0001}.task{min-height:68px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee}.task:last-child{border:0}.task-dot{width:11px;height:11px;border-radius:50%;flex:none}.task-main{flex:1;min-width:0}.task-title{font-size:17px;font-weight:600}.task-description{margin-top:3px;color:#999;font-size:13px}.check{width:34px;height:34px;border-radius:10px;border:2px solid #ddd;background:#fff;font-size:18px}.check.done{background:#222;border-color:#222;color:#fff}.viewing-sister .check.done{opacity:.5}.counter{display:flex;align-items:center;gap:7px}.counter button{width:32px;height:32px;border:0;border-radius:9px;background:#eee;font-size:18px}.counter-value{min-width:45px;text-align:center;font-weight:700;font-size:12px}.delete{border:0;background:transparent;color:#bbb;font-size:19px}.add{width:100%;margin-top:14px;padding:13px;border:1.5px dashed #c9c4ba;border-radius:14px;background:#fff9;color:#777}.hint{text-align:center;margin-top:24px;color:#aaa;font-size:13px}.calendar-page{background:#f5f9ff}.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.calendar-title{font-size:30px;font-weight:700}.month-button{border:0;background:#fff;width:38px;height:38px;border-radius:12px;font-size:19px;box-shadow:0 3px 12px #0001}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{text-align:center;font-size:13px;color:#888;padding-bottom:12px}.calendar-grid{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #0001}.day{position:relative;height:72px;padding:7px;border-right:1px solid #eee;border-bottom:1px solid #eee}.day:nth-child(7n){border-right:0}.day.empty{background:#fafafa}.day.selected{background:#edf5ff}.day-number{font-size:13px;font-weight:600}.dots{position:absolute;left:7px;right:5px;bottom:7px;display:flex;flex-wrap:wrap;gap:3px}.dot{width:7px;height:7px;border-radius:50%}.dot.sister{opacity:.5}.legend{display:flex;justify-content:center;gap:18px;margin-top:16px;color:#777;font-size:12px}.legend span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:5px}.legend .light{opacity:.5}.modal-bg{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:#0006;padding:16px}.modal-bg.open{display:flex}.modal{width:min(100%,480px);max-height:92dvh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:21px;font-weight:700}.close{border:0;background:#eee;width:34px;height:34px;border-radius:50%}.row{margin-bottom:14px}.row label{display:block;margin-bottom:6px;font-size:13px;color:#666}.row input,.row select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff}.grid{display:grid;grid-template-columns:85px 1fr;gap:10px}.color{height:44px;padding:4px!important}.counter-options{display:none}.counter-options.show{display:block}.save{width:100%;padding:13px;border:0;border-radius:12px;background:#222;color:#fff;font-weight:700}.note{font-size:12px;color:#999;margin-top:9px;line-height:1.5}@media(max-width:500px){.page{padding:24px 16px}.day{height:62px}.date{font-size:38px}.dot{width:6px;height:6px}}
</style></head><body>
<div class="pages" id="pages">
 <section class="page daily-page" id="dailyPage"><div class="year" id="dailyYear"></div><div class="date" id="dailyDate"></div>
  <div class="person-switch" aria-label="你是誰⊙o⊙"><button class="person-button active" id="meButton" onclick="selectPerson('me')">Zhen</button><button class="person-button sister" id="sisterButton" onclick="selectPerson('sister')">Ting</button></div>
  <div class="task-box" id="taskBox"></div><button class="add" onclick="openModal()">＋ 新增事項</button><div class="hint">← 往左滑看月曆</div>
 </section>
 <section class="page calendar-page"><div class="calendar-header"><button class="month-button" onclick="changeMonth(-1)">‹</button><div class="calendar-title" id="calendarTitle"></div><button class="month-button" onclick="changeMonth(1)">›</button></div>
  <div class="weekdays"><div class="weekday">日</div><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div></div><div class="calendar-grid" id="calendarGrid"></div>
  <div class="legend"><div><span></span>Zhen's打卡</div><div><span class="light"></span>Ting's打卡</div></div><div class="hint">往右滑回單日 →</div>
 </section>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head">新增事項<button class="close" onclick="closeModal()">×</button></div>
 <div class="grid"><div class="row"><label>Emoji</label><input id="fEmoji" value="🚶" maxlength="4"></div><div class="row"><label>事項名稱</label><input id="fName" placeholder="例如：走路" maxlength="20"></div></div>
 <div class="row"><label>小提醒</label><input id="fDesc" placeholder="例如：每次 1000 步" maxlength="40"></div>
 <div class="grid"><div class="row"><label>顏色</label><input class="color" id="fColor" type="color" value="#f59e0b"></div><div class="row"><label>紀錄方式</label><select id="fType" onchange="counterFields.classList.toggle('show',this.value==='counter')"><option value="check">完成／未完成</option><option value="counter">＋／－累計</option></select></div></div>
 <div class="counter-options" id="counterFields"><div class="grid"><div class="row"><label>每次增加</label><input id="fStep" type="number" min="1" value="1000"></div><div class="row"><label>單位</label><input id="fUnit" value="步" maxlength="8"></div></div><div class="row"><label>最多按幾次</label><input id="fMax" type="number" min="1" max="99" value="20"></div></div>
 <button class="save" onclick="addTask()">新增</button><div class="note">顏色選一次即可：Zhen的月曆點是 100%，Ting會自動變成 50%。自訂事項右邊的 × 可以刪除。</div>
</div></div>
<script>
const DEFAULT_TASKS=[
 {id:"sunscreen",emoji:"☀️",name:"擦防曬",description:"會曬黑噢",color:"#ff5a5a",type:"check",builtIn:true},
 {id:"study",emoji:"📖",name:"讀書",description:"1小時",color:"#79c85b",type:"check",builtIn:true},
 {id:"water",emoji:"🚰",name:"喝水",description:"700 c.c.",color:"#a45ac7",type:"counter",step:700,unit:"c.c.",max:2,builtIn:true}
];
const today=new Date();let selectedDate=new Date(today.getFullYear(),today.getMonth(),today.getDate()),calendarYear=selectedDate.getFullYear(),calendarMonth=selectedDate.getMonth(),selectedPerson="me";
let tasks=JSON.parse(localStorage.getItem("checkinTasks"))||DEFAULT_TASKS,records=JSON.parse(localStorage.getItem("checkinRecords"))||{};saveTasks();
function blank(){const r={};tasks.forEach(t=>r[t.id]=t.type==="counter"?0:false);return r}
function person(r={}){const x={...r};tasks.forEach(t=>{if(x[t.id]===undefined)x[t.id]=t.type==="counter"?0:false});return x}
function norm(r){if(r&&r.me&&r.sister)return{me:person(r.me),sister:person(r.sister)};return{me:person(r||{}),sister:blank()}}
Object.keys(records).forEach(k=>records[k]=norm(records[k]));saveRecords();
function saveTasks(){localStorage.setItem("checkinTasks",JSON.stringify(tasks))}function saveRecords(){localStorage.setItem("checkinRecords",JSON.stringify(records))}
function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dayRecord(){const k=key(selectedDate);records[k]=norm(records[k]);return records[k]}function current(){return dayRecord()[selectedPerson]}
function selectPerson(p){selectedPerson=p;renderDaily()}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function renderDaily(){dailyYear.textContent=selectedDate.getFullYear();dailyDate.textContent=`${selectedDate.getMonth()+1}/${selectedDate.getDate()}`;meButton.classList.toggle("active",selectedPerson==="me");sisterButton.classList.toggle("active",selectedPerson==="sister");dailyPage.classList.toggle("viewing-sister",selectedPerson==="sister");const r=current();taskBox.innerHTML="";
 tasks.forEach(t=>{const row=document.createElement("div");row.className="task";let control;if(t.type==="counter"){control=`<div class="counter"><button onclick="count('${t.id}',-1)">−</button><div class="counter-value">${Number(r[t.id]||0)*Number(t.step||1)} ${esc(t.unit||"")}</div><button onclick="count('${t.id}',1)">+</button></div>`}else control=`<button class="check ${r[t.id]?"done":""}" onclick="toggle('${t.id}')">${r[t.id]?"✓":""}</button>`;
 row.innerHTML=`<div class="task-dot" style="background:${t.color}"></div><div class="task-main"><div class="task-title">${esc(t.emoji)} ${esc(t.name)}</div><div class="task-description">${esc(t.description||"")}</div></div>${control}${t.builtIn?"":`<button class="delete" onclick="removeTask('${t.id}')">×</button>`}`;taskBox.appendChild(row)})}
function toggle(id){const r=current();r[id]=!r[id];saveRecords();renderDaily();renderCalendar()}function count(id,n){const t=tasks.find(x=>x.id===id),r=current();r[id]=Math.max(0,Math.min(Number(t.max||99),Number(r[id]||0)+n));saveRecords();renderDaily();renderCalendar()}
function dot(box,color,who){const d=document.createElement("div");d.className=`dot ${who}`;d.style.background=color;box.appendChild(d)}function done(r,t){return t.type==="counter"?Number(r[t.id])>0:Boolean(r[t.id])}
function renderCalendar(){calendarGrid.innerHTML="";calendarTitle.textContent=`${calendarYear}.${calendarMonth+1}`;const first=new Date(calendarYear,calendarMonth,1).getDay(),days=new Date(calendarYear,calendarMonth+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement("div");e.className="day empty";calendarGrid.appendChild(e)}
 for(let n=1;n<=days;n++){const d=new Date(calendarYear,calendarMonth,n),stored=records[key(d)],r=stored?norm(stored):null,b=document.createElement("div");b.className="day";if(selectedDate.getFullYear()===calendarYear&&selectedDate.getMonth()===calendarMonth&&selectedDate.getDate()===n)b.classList.add("selected");b.innerHTML=`<div class="day-number">${n}</div>`;const dots=document.createElement("div");dots.className="dots";if(r)tasks.forEach(t=>{if(done(r.me,t))dot(dots,t.color,"me");if(done(r.sister,t))dot(dots,t.color,"sister")});b.appendChild(dots);b.onclick=()=>{selectedDate=d;renderDaily();renderCalendar();pages.scrollTo({left:0,behavior:"smooth"})};calendarGrid.appendChild(b)}}
function changeMonth(n){calendarMonth+=n;if(calendarMonth>11){calendarMonth=0;calendarYear++}if(calendarMonth<0){calendarMonth=11;calendarYear--}renderCalendar()}
function openModal(){modalBg.classList.add("open");fName.focus()}function closeModal(){modalBg.classList.remove("open")}
function addTask(){const name=fName.value.trim();if(!name){alert("先幫事項取個名字啦");return}const t={id:`custom_${Date.now()}`,emoji:fEmoji.value.trim()||"✨",name,description:fDesc.value.trim(),color:fColor.value,type:fType.value,builtIn:false};if(t.type==="counter"){t.step=Math.max(1,Number(fStep.value)||1);t.unit=fUnit.value.trim();t.max=Math.max(1,Math.min(99,Number(fMax.value)||20))}tasks.push(t);Object.keys(records).forEach(k=>records[k]=norm(records[k]));saveTasks();saveRecords();closeModal();fName.value="";renderDaily();renderCalendar()}
function removeTask(id){const t=tasks.find(x=>x.id===id);if(!t||!confirm(`確定刪除「${t.name}」嗎？以前的紀錄也會一起刪掉。`))return;tasks=tasks.filter(x=>x.id!==id);Object.values(records).forEach(d=>["me","sister"].forEach(p=>{if(d[p])delete d[p][id]}));saveTasks();saveRecords();renderDaily();renderCalendar()}
renderDaily();renderCalendar();
</script></body></html>
