<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>打卡日曆</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,"Noto Sans TC",sans-serif;overflow:hidden;color:#222}button,input,select{font:inherit}.pages{width:100vw;height:100dvh;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none}.pages::-webkit-scrollbar{display:none}.page{min-width:100vw;height:100dvh;overflow-y:auto;scroll-snap-align:start;padding:28px 20px}.daily{background:#fffdf7}.year{font-size:16px;color:#777;margin-bottom:4px}.date{font-size:42px;font-weight:700;margin-bottom:18px}.account{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:10px 13px;border-radius:14px;background:#eeeae2;color:#666;font-size:14px}.account b{color:#222}.logout{border:0;background:#fff;padding:7px 11px;border-radius:9px;color:#777}.task-box{background:#fff;border-radius:20px;padding:8px 20px;box-shadow:0 4px 18px #0001}.task{min-height:68px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee}.task:last-child{border:0}.task-dot{width:11px;height:11px;border-radius:50%;flex:none}.task-main{flex:1;min-width:0}.task-title{font-size:17px;font-weight:600}.desc{margin-top:3px;color:#999;font-size:13px}.check{width:34px;height:34px;border-radius:10px;border:2px solid #ddd;background:#fff;font-size:18px}.check.done{background:#222;border-color:#222;color:#fff}.ting .check.done{opacity:.5}.counter{display:flex;align-items:center;gap:7px}.counter button{width:32px;height:32px;border:0;border-radius:9px;background:#eee;font-size:18px}.counter-value{min-width:46px;text-align:center;font-weight:700;font-size:12px}.delete{border:0;background:transparent;color:#bbb;font-size:19px}.add{width:100%;margin-top:14px;padding:13px;border:1.5px dashed #c9c4ba;border-radius:14px;background:#fff9;color:#777}.hint{text-align:center;margin-top:24px;color:#aaa;font-size:13px}.calendar{background:#f5f9ff}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.calendar-title{font-size:30px;font-weight:700}.month{border:0;background:#fff;width:38px;height:38px;border-radius:12px;font-size:19px;box-shadow:0 3px 12px #0001}.week,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr)}.weekday{text-align:center;font-size:13px;color:#888;padding-bottom:12px}.calendar-grid{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #0001}.day{position:relative;height:72px;padding:7px;border-right:1px solid #eee;border-bottom:1px solid #eee}.day:nth-child(7n){border-right:0}.day.empty{background:#fafafa}.day.selected{background:#edf5ff}.day-number{font-size:13px;font-weight:600}.dots{position:absolute;left:7px;right:5px;bottom:7px;display:flex;flex-wrap:wrap;gap:3px}.dot{width:7px;height:7px;border-radius:50%}.dot.sister{opacity:.5}.legend{display:flex;justify-content:center;gap:18px;margin-top:16px;color:#777;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#555;margin-right:5px}.legend .light{opacity:.5}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:#0006;padding:16px}.overlay.open{display:flex}.modal{width:min(100%,480px);max-height:92dvh;overflow:auto;background:#fff;border-radius:22px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:21px;font-weight:700}.close{border:0;background:#eee;width:34px;height:34px;border-radius:50%}.row{margin-bottom:14px}.row label{display:block;margin-bottom:6px;font-size:13px;color:#666}.row input,.row select{width:100%;padding:11px;border:1px solid #ddd;border-radius:11px;background:#fff}.grid{display:grid;grid-template-columns:85px 1fr;gap:10px}.color{height:44px;padding:4px!important}.counter-fields{display:none}.counter-fields.show{display:block}.save{width:100%;padding:13px;border:0;border-radius:12px;background:#222;color:#fff;font-weight:700}.note{font-size:12px;color:#999;margin-top:9px;line-height:1.5}.login{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#fffdf7;padding:22px}.login.hidden{display:none}.login-card{width:min(100%,390px);background:#fff;padding:26px;border-radius:22px;box-shadow:0 8px 30px #0002}.login h1{font-size:28px;margin-bottom:6px}.login p{color:#888;margin-bottom:20px}.login input{width:100%;margin-bottom:11px;padding:12px;border:1px solid #ddd;border-radius:11px}.login button{width:100%;padding:12px;border:0;border-radius:11px;background:#222;color:#fff;font-weight:700}.error{min-height:20px;margin-top:10px;color:#d44;font-size:13px}.sync{font-size:12px;color:#999;margin-left:6px}@media(max-width:500px){.page{padding:24px 16px}.day{height:62px}.date{font-size:38px}.dot{width:6px;height:6px}}
    </style>
  </head>
  <body>
    <div class="login" id="login">
      <div class="login-card">
        <h1>打卡日曆</h1>
        <p>Zhen × Ting</p>
        <input id="email" type="email" placeholder="電子郵件" autocomplete="username">
        <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
        <button id="loginBtn">登入</button>
        <div class="error" id="loginError"></div>
      </div>
    </div>
    <div class="pages" id="pages">
      <section class="page daily" id="dailyPage">
        <div class="year" id="dailyYear"></div>
        <div class="date" id="dailyDate"></div>
        <div class="account">
          <div>
            <b id="accountName">登入中</b>
            <span class="sync" id="syncState"></span>
          </div>
          <button class="logout" id="logoutBtn">登出</button>
        </div>
        <div class="task-box" id="taskBox"></div>
        <button class="add" id="addBtn">＋ 新增事項</button>
        <div class="hint">← 往左滑看月曆</div>
      </section>
      <section class="page calendar">
        <div class="calendar-head">
          <button class="month" id="prev">‹</button>
          <div class="calendar-title" id="calendarTitle"></div>
          <button class="month" id="next">›</button>
        </div>
        <div class="week">
          <div class="weekday">日</div>
          <div class="weekday">一</div>
          <div class="weekday">二</div>
          <div class="weekday">三</div>
          <div class="weekday">四</div>
          <div class="weekday">五</div>
          <div class="weekday">六</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="legend">
          <div>
            <i></i>Zhen's打卡
          </div>
          <div>
            <i class="light"></i>Ting's打卡
          </div>
        </div>
        <div class="hint">往右滑回單日 →</div>
      </section>
    </div>
    <div class="overlay" id="taskModal">
      <div class="modal">
        <div class="modal-head">新增事項
          <button class="close" id="closeModal">×</button>
        </div>
        <div class="grid">
          <div class="row">
            <label>Emoji</label>
            <input id="fEmoji" value="💩" maxlength="4">
          </div>
          <div class="row">
            <label>事項名稱</label>
            <input id="fName" placeholder="例如：排遺" maxlength="20">
          </div>
        </div>
        <div class="row">
          <label>小提醒</label>
          <input id="fDesc" placeholder="例如：一天不要太多次" maxlength="40">
        </div>
        <div class="grid">
          <div class="row">
            <label>顏色</label>
            <input class="color" id="fColor" type="color" value="#f59e0b">
          </div>
          <div class="row">
            <label>紀錄方式</label>
            <select id="fType">
              <option value="check">完成/未完成</option>
              <option value="counter">＋/－累計</option>
            </select>
          </div>
        </div>
        <div class="counter-fields" id="counterFields">
          <div class="grid">
            <div class="row">
              <label>每次增加</label>
              <input id="fStep" type="number" min="1" value="1000">
            </div>
            <div class="row">
              <label>單位</label>
              <input id="fUnit" value="步" maxlength="8">
            </div>
          </div>
          <div class="row">
            <label>最多按幾次</label>
            <input id="fMax" type="number" min="1" max="99" value="20">
          </div>
        </div>
        <button class="save" id="saveTask">新增</button>
        <div class="note">Zhen的月曆點是100%，Ting會自動顯示成50%。</div>
      </div>
    </div>
    <script type="module">
      import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
      import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
      import{getFirestore,doc,collection,getDoc,setDoc,updateDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
      const firebaseConfig={apiKey:"AIzaSyAWbob6j02jTCAaFVqBsWoWxwekRS4Br8E",authDomain:"couple-daily-tracker.firebaseapp.com",projectId:"couple-daily-tracker",storageBucket:"couple-daily-tracker.firebasestorage.app",messagingSenderId:"566590935557",appId:"1:566590935557:web:13c0f91a0f20a8f4e1026c"};
      const USERS={"lAX05vlJA5bPkJElqXBcjWXBE3S2":{key:"me",name:"Zhen"},"SNJ4fIBT8IRHC9UUWIBpnEsaFfm2":{key:"sister",name:"Ting"}};
      const DEFAULT_TASKS=[{id:"sunscreen",emoji:"☀️",name:"擦防曬",description:"會曬黑噢",color:"#ff5a5a",type:"check",builtIn:true},{id:"study",emoji:"📖",name:"讀書",description:"讀書1小時",color:"#79c85b",type:"check",builtIn:true},{id:"water",emoji:"🚰",name:"喝水",description:"700 c.c.",color:"#a45ac7",type:"counter",step:700,unit:"c.c.",max:2,builtIn:true}];
      const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),tasksRef=doc(db,"shared","tasks");
      const $=id=>document.getElementById(id);let tasks=DEFAULT_TASKS,records={},person=null,selectedDate=new Date(),calendarYear=selectedDate.getFullYear(),calendarMonth=selectedDate.getMonth(),unsubs=[];
      function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function emptyPerson(){const x={};tasks.forEach(t=>x[t.id]=t.type==="counter"?0:false);return x}function normalize(r={}){return{me:{...emptyPerson(),...(r.me||{})},sister:{...emptyPerson(),...(r.sister||{})}}}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
      async function startSync(){unsubs.forEach(f=>f());unsubs=[];$("syncState").textContent="同步中…";const first=await getDoc(tasksRef);if(!first.exists())await setDoc(tasksRef,{items:JSON.parse(localStorage.getItem("checkinTasks"))||DEFAULT_TASKS});unsubs.push(onSnapshot(tasksRef,s=>{tasks=s.data()?.items||DEFAULT_TASKS;renderDaily();renderCalendar();$("syncState").textContent="已同步"}));unsubs.push(onSnapshot(collection(db,"records"),snap=>{records={};snap.forEach(d=>records[d.id]=normalize(d.data()));renderDaily();renderCalendar();$("syncState").textContent="已同步"}));if(!localStorage.getItem("firebaseMigrationV1")){const old=JSON.parse(localStorage.getItem("checkinRecords")||"{}");for(const[k,v]of Object.entries(old))await setDoc(doc(db,"records",k),normalize(v),{merge:true});localStorage.setItem("firebaseMigrationV1","1")}}
      onAuthStateChanged(auth,async user=>{if(!user){$("login").classList.remove("hidden");return}const info=USERS[user.uid];if(!info){await signOut(auth);$("loginError").textContent="這個帳號沒有日曆權限";return}person=info;$("accountName").textContent=info.name;$("dailyPage").classList.toggle("ting",info.key==="sister");$("login").classList.add("hidden");await startSync()});
      $("loginBtn").onclick=async()=>{try{$("loginError").textContent="";$("loginBtn").disabled=true;await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("loginError").textContent="登入失敗，請檢查信箱和密碼"}finally{$("loginBtn").disabled=false}};$("password").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};$("logoutBtn").onclick=()=>signOut(auth);
      function current(){return normalize(records[key(selectedDate)])[person.key]}function done(r,t){return t.type==="counter"?Number(r[t.id])>0:Boolean(r[t.id])}
      function renderDaily(){if(!person)return;$("dailyYear").textContent=selectedDate.getFullYear();$("dailyDate").textContent=`${selectedDate.getMonth()+1}/${selectedDate.getDate()}`;const r=current();$("taskBox").innerHTML="";tasks.forEach(t=>{const row=document.createElement("div");row.className="task";const control=t.type==="counter"?`<div class="counter"><button data-count="${t.id}" data-delta="-1">−</button><div class="counter-value">${Number(r[t.id]||0)*Number(t.step||1)} ${esc(t.unit||"")}</div><button data-count="${t.id}" data-delta="1">+</button></div>`:`<button class="check ${r[t.id]?"done":""}" data-check="${t.id}">${r[t.id]?"✓":""}</button>`;row.innerHTML=`<div class="task-dot" style="background:${t.color}"></div><div class="task-main"><div class="task-title">${esc(t.emoji)} ${esc(t.name)}</div><div class="desc">${esc(t.description||"")}</div></div>${control}${t.builtIn?"":`<button class="delete" data-delete="${t.id}">×</button>`}`;$("taskBox").appendChild(row)})}
      $("taskBox").onclick=async e=>{const id=e.target.dataset.check||e.target.dataset.count||e.target.dataset.delete;if(!id)return;if(e.target.dataset.delete){const t=tasks.find(x=>x.id===id);if(confirm(`確定刪除「${t.name}」嗎？`))await updateDoc(tasksRef,{items:tasks.filter(x=>x.id!==id)});return}const r=current();let value;if(e.target.dataset.check)value=!r[id];else{const t=tasks.find(x=>x.id===id);value=Math.max(0,Math.min(Number(t.max||99),Number(r[id]||0)+Number(e.target.dataset.delta)))}await setDoc(doc(db,"records",key(selectedDate)),{[person.key]:{[id]:value}},{merge:true})};
      function addDot(box,color,who){const d=document.createElement("i");d.className=`dot ${who}`;d.style.background=color;box.appendChild(d)}function renderCalendar(){$("calendarGrid").innerHTML="";$("calendarTitle").textContent=`${calendarYear}.${calendarMonth+1}`;const first=new Date(calendarYear,calendarMonth,1).getDay(),days=new Date(calendarYear,calendarMonth+1,0).getDate();for(let i=0;i<first;i++){const x=document.createElement("div");x.className="day empty";$("calendarGrid").appendChild(x)}for(let n=1;n<=days;n++){const d=new Date(calendarYear,calendarMonth,n),r=records[key(d)]?normalize(records[key(d)]):null,b=document.createElement("div");b.className="day";if(selectedDate.getFullYear()===calendarYear&&selectedDate.getMonth()===calendarMonth&&selectedDate.getDate()===n)b.classList.add("selected");b.innerHTML=`<div class="day-number">${n}</div>`;const dots=document.createElement("div");dots.className="dots";if(r)tasks.forEach(t=>{if(done(r.me,t))addDot(dots,t.color,"me");if(done(r.sister,t))addDot(dots,t.color,"sister")});b.appendChild(dots);b.onclick=()=>{selectedDate=d;renderDaily();renderCalendar();$("pages").scrollTo({left:0,behavior:"smooth"})};$("calendarGrid").appendChild(b)}}
      function month(n){calendarMonth+=n;if(calendarMonth>11){calendarMonth=0;calendarYear++}if(calendarMonth<0){calendarMonth=11;calendarYear--}renderCalendar()}$("prev").onclick=()=>month(-1);$("next").onclick=()=>month(1);
      $("addBtn").onclick=()=>{$("taskModal").classList.add("open");$("fName").focus()};$("closeModal").onclick=()=>$("taskModal").classList.remove("open");$("taskModal").onclick=e=>{if(e.target===$("taskModal"))$("taskModal").classList.remove("open")};$("fType").onchange=()=>$("counterFields").classList.toggle("show",$("fType").value==="counter");
      $("saveTask").onclick=async()=>{const name=$("fName").value.trim();if(!name)return alert("先幫事項取個名字啦");const t={id:`custom_${Date.now()}`,emoji:$("fEmoji").value.trim()||"✨",name,description:$("fDesc").value.trim(),color:$("fColor").value,type:$("fType").value,builtIn:false};if(t.type==="counter"){t.step=Math.max(1,Number($("fStep").value)||1);t.unit=$("fUnit").value.trim();t.max=Math.max(1,Math.min(99,Number($("fMax").value)||20))}await setDoc(tasksRef,{items:[...tasks,t]});$("taskModal").classList.remove("open");$("fName").value=""};
      renderCalendar();
    </script>
  </body>
</html>
